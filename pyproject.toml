[project]
name = "jobagent"
version = "0.1.0"
description = "LangGraph multi-agent job-application automation"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- graph ---
    "langgraph>=1.2.10",                     # StateGraph, Send, interrupt, Command (v1 API)
    "langgraph-checkpoint-postgres>=3.1.1",  # PostgresSaver -> guardrail 7 resumability
    "langchain-core>=1.5.3",
    # --- models & config ---
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.2",
    # --- persistence ---
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary,pool]>=3.3.4",           # psycopg3 -- what PostgresSaver itself needs
    "pgvector>=0.5.0",
    # --- observability ---
    "structlog>=26.1.0",
    # --- CLI / control plane ---
    "typer>=0.27.1",
    "rich>=13.9",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.34",
    "apscheduler>=3.11.3",
    # --- IO ---
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
browser = ["playwright>=1.62.0"]                   # M2 naukri, M5, M6
render = ["docxtpl>=0.20.2", "python-docx>=1.1"]   # M4
embed = ["fastembed>=0.8.0"]                       # 384-dim, ONNX, no torch, no API key
llm = ["claude-agent-sdk>=0.2.128"]                # Claude Code auth, not API billing
gmail = ["google-api-python-client>=2.156", "google-auth-oauthlib>=1.2"]

[project.scripts]
jobagent = "jobagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.4.0",
    "freezegun>=1.5",
    "ruff>=0.16.1",
    "mypy>=1.14",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobagent"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF", "ASYNC", "S", "PTH", "DTZ", "ANN"]
ignore = [
    "ANN401",  # typed **kwargs as Any is fine at adapter boundaries
    "S101",    # assert is used for invariants
]

[tool.ruff.lint.per-file-ignores]
"jobagent/tests/*" = ["S101", "S108", "ANN", "PTH"]
"jobagent/graph/subgraphs/*" = ["ARG001", "ARG002"]  # stub params intentionally unused
"jobagent/adapters/portals/*" = ["ARG002"]
"jobagent/adapters/ats/*" = ["ARG002"]
"migrations/*" = ["ANN", "E501", "INP001"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "docxtpl.*",
    "fastembed.*",
    "apscheduler.*",
    "pgvector.*",
    "claude_agent_sdk.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["jobagent/tests"]
addopts = "-q --strict-markers"
markers = [
    "pg: requires a live Postgres (skipped unless JOBAGENT_TEST_DSN is set)",
    "browser: requires Playwright chromium",
    "llm: requires Claude Code SDK auth",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["jobagent"]
omit = ["jobagent/tests/*"]
