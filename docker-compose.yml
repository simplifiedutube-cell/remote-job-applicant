services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports:
      # 5433 on the host so this never collides with a local postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE, on first creation of the pgdata volume. `make nuke` re-triggers it.
      - ./ops/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
